[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wealthforge"
dynamic = ["version"]
description = "A local-first organizer for investments, real estate and business stakes, with automatic B3 and US quotes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tobias Hopf de Souza" }]
keywords = ["portfolio", "personal finance", "net worth", "investments", "real estate", "b3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wealthforge = "wealthforge.cli:run"

[project.urls]
Homepage = "https://github.com/Tobiashopf/wealthforge"
Issues = "https://github.com/Tobiashopf/wealthforge/issues"

[tool.hatch.version]
path = "src/wealthforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wealthforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/wealthforge/web/app.py" = ["E501"]
